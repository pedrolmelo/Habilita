  # DL3066: Exigência de declarar USER por UID numérico em vez de nome de usuário.
  # Justificativa: O usuário 'node' é o usuário não-root padrão fornecido pelas imagens oficiais do Node.js,
  # com UID e GID 1000 fixos e documentados. O uso do nome 'node' melhora a legibilidade e mantém a convenção oficial.
  - DL3066
