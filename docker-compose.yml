# Ambiente local do Habilita: `docker compose up --build`
#
# Funciona num clone limpo, sem criar o `.env`. O `.env` é OPCIONAL e serve só para
# sobrescrever valores (portas, nível de log...). Veja o `.env.example`.
#
# Serviços:
#   emulators    -> Firebase Emulator Suite (Auth e Firestore) + interface web
#   storage-db   -> PostgreSQL 15 (metadados e papéis do Supabase Storage)
#   storage      -> Supabase Storage API (backend local de arquivos)
#   storage-init -> Inicializador idempotente do bucket privado `documentos`
#   api          -> FastAPI (alvo `dev` do apps/api/Dockerfile, com recarga automática)
#   web          -> Vite + React (alvo `dev` do apps/web/Dockerfile)
# Ordem de subida: emulators/storage-db -> storage -> storage-init -> api -> web.

name: habilita

# Bloco reutilizado pelos serviços: guarda os logs em arquivo JSON com rotação
# (no máximo 3 arquivos de 10 MB por serviço) para não encher o disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Emuladores do Firebase (projeto `demo-habilita`: roda 100% local, sem Google Cloud)
  # Auth na porta 9099 e Firestore na porta 8080.
  # ---------------------------------------------------------------------------
  emulators:
    build:
      context: . # raiz do repositório: a imagem copia firebase.json, *.rules e .firebaserc
      dockerfile: infra/emulators/Dockerfile
    image: habilita-emulators:local
    ports:
      - "127.0.0.1:${EMULATOR_UI_HOST_PORT:-4000}:4000" # interface dos emuladores
      - "127.0.0.1:${AUTH_EMULATOR_HOST_PORT:-9099}:9099" # Auth
      - "127.0.0.1:${FIRESTORE_EMULATOR_HOST_PORT:-8080}:8080" # Firestore
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s # a primeira subida dos emuladores (JVM) é lenta
    mem_limit: 1536m
    cpus: 1.5
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

  # ---------------------------------------------------------------------------
  # Banco de Dados do Supabase Storage (PostgreSQL 15 Alpine)
  # Executa o script de inicialização de papéis (00-init.sql) na primeira subida.
  # ---------------------------------------------------------------------------
  storage-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - ./infra/storage/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - storage_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # ---------------------------------------------------------------------------
  # Supabase Storage API (execução local com backend de arquivos em disco)
  # ---------------------------------------------------------------------------
  storage:
    image: supabase/storage-api:v1.11.1
    depends_on:
      storage-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-postgres}@storage-db:5432/postgres
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters-long}
      ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE}
      SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: ${STORAGE_MAX_BYTES:-5242880}
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    ports:
      - "127.0.0.1:${STORAGE_HOST_PORT:-5000}:5000"
    volumes:
      - storage_data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # ---------------------------------------------------------------------------
  # Inicializador do Bucket de Documentos (executa uma vez e finaliza com sucesso)
  # Cria o bucket privado `documentos` com teto de 5 MB e tipos PDF e JPEG.
  # ---------------------------------------------------------------------------
  storage-init:
    image: curlimages/curl:8.10.1
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy
    environment:
      STORAGE_URL: http://storage:5000
      STORAGE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-documentos}
      STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-5242880}
      STORAGE_ALLOWED_MIME: ${STORAGE_ALLOWED_MIME:-application/pdf,image/jpeg}
    volumes:
      - ./infra/storage/init-bucket.sh:/usr/local/bin/init-bucket.sh:ro
    entrypoint: ["sh", "/usr/local/bin/init-bucket.sh"]
    mem_limit: 128m
    cpus: 0.25
    logging: *logging

  # ---------------------------------------------------------------------------
  # API (FastAPI)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      target: dev
    image: habilita-api:dev
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "8000"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-habilita}
      FIREBASE_AUTH_EMULATOR_HOST: emulators:9099
      FIRESTORE_EMULATOR_HOST: emulators:8080
      STORAGE_URL: http://storage:5000
      STORAGE_PUBLIC_URL: http://127.0.0.1:${STORAGE_HOST_PORT:-5000}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-documentos}
      STORAGE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q}
      STORAGE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      # Código-fonte e testes (somente leitura): recarga automática e execução de testes.
      - ./apps/api/src:/app/src:ro
      - ./apps/api/tests:/app/tests:ro
      - ./firestore.rules:/app/firestore.rules:ro
      - ./storage.rules:/app/storage.rules:ro
    depends_on:
      emulators:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

  # ---------------------------------------------------------------------------
  # Web (Vite + React) — só desenvolvimento
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      target: dev
    image: habilita-web:dev
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:5173"
    volumes:
      - ./apps/web/src:/app/src:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    cpus: 1.0
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

  # ---------------------------------------------------------------------------
  # Seed: popula os emuladores com dados de demonstração determinísticos.
  # Execução manual: `docker compose --profile seed run --rm seed`
  # ---------------------------------------------------------------------------
  seed:
    profiles:
      - seed
    build:
      context: ./seed
      dockerfile: Dockerfile
    image: habilita-seed:local
    pull_policy: build
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-habilita}
      FIREBASE_AUTH_EMULATOR_HOST: emulators:9099
      FIRESTORE_EMULATOR_HOST: emulators:8080
      STORAGE_URL: http://storage:5000
      STORAGE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-documentos}
      CPF_HMAC_KEY: ${CPF_HMAC_KEY:-demo-cpf-hmac-key-for-emulator-only}
    depends_on:
      emulators:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 0.5
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

volumes:
  storage_db_data:
  storage_data:
