# Pipeline de Integração Contínua (CI) do Habilita.
# Checkpoint 1 (Fundação): segredos, higiene, qualidade (API e Web), build, dockerfiles e compose-smoke.
# O job `ci-ok` consolida todos os jobs e deve ser configurado como o único check obrigatório na proteção da `main`.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Menor permissão possível: o CI só precisa ler o código.
permissions:
  contents: read

# Cancela execuções antigas do mesmo PR quando chega um commit novo.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  # SHA-256 oficial de gitleaks_8.30.1_linux_x64.tar.gz (arquivo checksums.txt da release).
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  PRE_COMMIT_VERSION: 4.7.0

jobs:
  segredos:
    name: segredos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Gitleaks (binário oficial, versão e checksum fixos)
        run: |
          set -euo pipefail
          arquivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$arquivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${arquivo}"
          echo "${GITLEAKS_SHA256}  ${arquivo}" | sha256sum --check --strict
          tar -xzf "$arquivo" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Varrer todo o histórico do Git
        run: gitleaks git --config .gitleaks.toml --redact --verbose --no-banner .

  higiene:
    name: higiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar pre-commit
        run: python -m pip install "pre-commit==${PRE_COMMIT_VERSION}"

      - name: Rodar os hooks em todos os arquivos
        env:
          # O Gitleaks já roda no job `segredos`.
          SKIP: gitleaks
        run: pre-commit run --all-files --show-diff-on-failure

  api-qualidade:
    name: api-qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar uv e Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Sincronizar dependências da API
        working-directory: apps/api
        run: uv sync --frozen

      - name: Verificar lint com Ruff
        working-directory: apps/api
        run: uv run ruff check .

      - name: Verificar formatação com Ruff
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Verificar tipagem com mypy
        working-directory: apps/api
        run: uv run mypy

      - name: Verificar arquitetura com import-linter
        working-directory: apps/api
        run: uv run lint-imports

  seed-qualidade:
    name: seed-qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar uv e Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "seed/uv.lock"

      - name: Sincronizar dependências do seed
        working-directory: seed
        run: uv sync --frozen

      - name: Verificar lint com Ruff
        working-directory: seed
        run: uv run ruff check .

      - name: Verificar formatação com Ruff
        working-directory: seed
        run: uv run ruff format --check .

      - name: Verificar tipagem com mypy
        working-directory: seed
        run: uv run mypy


  web-qualidade:
    name: web-qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js (versão sincronizada com apps/web/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "apps/web/.nvmrc"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Instalar dependências do frontend (npm ci congelado e sem scripts)
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Verificar lint com ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Verificar tipagem com TypeScript (tsc)
        working-directory: apps/web
        run: npm run typecheck

      - name: Verificar formatação com Prettier
        working-directory: apps/web
        run: npm run format:check

  web-build:
    name: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: web-qualidade
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js (versão sincronizada com apps/web/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "apps/web/.nvmrc"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Instalar dependências do frontend (npm ci congelado e sem scripts)
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Compilar frontend (Vite build)
        working-directory: apps/web
        run: npm run build

  dockerfiles:
    name: dockerfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar Dockerfiles com Hadolint
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            -w /repo \
            hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552 \
            hadolint apps/api/Dockerfile apps/web/Dockerfile infra/emulators/Dockerfile seed/Dockerfile

  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - api-qualidade
      - web-qualidade
      - seed-qualidade
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar configuração do Docker Compose (sem .env)
        run: docker compose config --quiet

      - name: Subir ambiente local completo
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Testar endpoints de saúde e proxy
        run: |
          set -euo pipefail

          echo "==> Testando API direta (GET http://127.0.0.1:8000/healthz)..."
          api_res=$(curl -sS -f http://127.0.0.1:8000/healthz)
          echo "Resposta da API: $api_res"
          echo "$api_res" | grep -q '"status":"ok"'

          echo "==> Testando proxy Web -> API (GET http://127.0.0.1:5173/api/healthz)..."
          web_res=$(curl -sS -f http://127.0.0.1:5173/api/healthz)
          echo "Resposta do proxy: $web_res"
          echo "$web_res" | grep -q '"status":"ok"'

          echo "==> Testando interface web dos emuladores (GET http://127.0.0.1:4000)..."
          curl -sS -f -I http://127.0.0.1:4000 > /dev/null

      - name: Popular dados com seed e verificar idempotência
        run: |
          set -euo pipefail

          echo "==> Executando seed pela primeira vez..."
          docker compose --profile seed run --rm seed

          echo "==> Verificando estado e capturando checksum inicial..."
          res1=$(docker compose --profile seed run --rm seed --verificar 2>&1)
          echo "$res1"
          checksum1=$(echo "$res1" | grep "CHECKSUM FIRESTORE:" | awk '{print $NF}' || true)
          if [ -z "$checksum1" ]; then
            echo "ERRO: Checksum inicial não capturado."
            exit 1
          fi

          echo "==> Executando seed pela segunda vez (teste de idempotência)..."
          docker compose --profile seed run --rm seed

          echo "==> Verificando estado e capturando checksum da segunda execução..."
          res2=$(docker compose --profile seed run --rm seed --verificar 2>&1)
          echo "$res2"
          checksum2=$(echo "$res2" | grep "CHECKSUM FIRESTORE:" | awk '{print $NF}' || true)
          if [ -z "$checksum2" ]; then
            echo "ERRO: Checksum secundário não capturado."
            exit 1
          fi

          if [ "$checksum1" != "$checksum2" ]; then
            echo "ERRO: Idempotência violada! Checksum 1 ($checksum1) != Checksum 2 ($checksum2)"
            exit 1
          fi
          echo "Idempotência confirmada com sucesso: checksum $checksum1 mantido intacto."

      - name: Validar regras deny-all nos emuladores do Firestore e Storage
        run: |
          set -euo pipefail

          echo "==> 1. Validando escrita não autenticada no Firestore..."
          http_code_fs_write=$(curl -s -o /tmp/fs_write_response.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"fields": {"probe": {"stringValue": "ci-deny-all"}}}' \
            "http://127.0.0.1:8080/v1/projects/demo-habilita/databases/(default)/documents/probe_smoke")

          echo "Código HTTP retornado (Firestore escrita): $http_code_fs_write"
          if [ "$http_code_fs_write" != "403" ]; then
            echo "ERRO: Esperado HTTP 403 (PERMISSION_DENIED) na escrita do Firestore, obtido $http_code_fs_write"
            cat /tmp/fs_write_response.json
            exit 1
          fi
          grep -q "PERMISSION_DENIED" /tmp/fs_write_response.json || {
            echo "ERRO: O corpo não contém 'PERMISSION_DENIED':"
            cat /tmp/fs_write_response.json
            exit 1
          }

          echo "==> 2. Validando leitura não autenticada no Firestore..."
          http_code_fs_read=$(curl -s -o /tmp/fs_read_response.json -w "%{http_code}" -X GET \
            "http://127.0.0.1:8080/v1/projects/demo-habilita/databases/(default)/documents/probe_smoke")

          echo "Código HTTP retornado (Firestore leitura): $http_code_fs_read"
          if [ "$http_code_fs_read" != "403" ]; then
            echo "ERRO: Esperado HTTP 403 (PERMISSION_DENIED) na leitura do Firestore, obtido $http_code_fs_read"
            cat /tmp/fs_read_response.json
            exit 1
          fi
          grep -q "PERMISSION_DENIED" /tmp/fs_read_response.json || {
            echo "ERRO: O corpo não contém 'PERMISSION_DENIED':"
            cat /tmp/fs_read_response.json
            exit 1
          }

          echo "==> 3. Validando escrita não autenticada no Storage..."
          http_code_st_write=$(curl -s -o /tmp/st_write_response.json -w "%{http_code}" -X POST \
            -H "Content-Type: text/plain" \
            -d "conteudo_teste" \
            "http://127.0.0.1:9199/v0/b/demo-habilita.appspot.com/o?name=probe_smoke.txt")

          echo "Código HTTP retornado (Storage escrita): $http_code_st_write"
          if [ "$http_code_st_write" != "403" ]; then
            echo "ERRO: Esperado HTTP 403 na escrita do Storage, obtido $http_code_st_write"
            cat /tmp/st_write_response.json
            exit 1
          fi
          grep -iq "permission" /tmp/st_write_response.json || {
            echo "ERRO: Resposta do Storage não indica negação de permissão:"
            cat /tmp/st_write_response.json
            exit 1
          }

          echo "==> 4. Validando leitura não autenticada no Storage..."
          http_code_st_read=$(curl -s -o /tmp/st_read_response.json -w "%{http_code}" -X GET \
            "http://127.0.0.1:9199/v0/b/demo-habilita.appspot.com/o/probe_smoke.txt")

          echo "Código HTTP retornado (Storage leitura): $http_code_st_read"
          if [ "$http_code_st_read" != "403" ]; then
            echo "ERRO: Esperado HTTP 403 na leitura do Storage, obtido $http_code_st_read"
            cat /tmp/st_read_response.json
            exit 1
          fi
          grep -iq "permission" /tmp/st_read_response.json || {
            echo "ERRO: Resposta do Storage não indica negação de permissão:"
            cat /tmp/st_read_response.json
            exit 1
          }

          echo "Regras deny-all do Firestore e Storage validadas com sucesso no emulador (leitura e escrita bloqueadas)."

      - name: Exibir diagnóstico em caso de falha
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose ps
          echo "=== docker compose logs ==="
          docker compose logs --no-color

      - name: Derrubar ambiente e limpar volumes
        if: always()
        run: docker compose down -v

  api-testes:
    name: api-testes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - api-qualidade
      - dockerfiles
      - seed-qualidade
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Subir ambiente local (emuladores e API)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Popular dados com seed
        run: docker compose --profile seed run --rm seed

      - name: Executar testes da API com pytest contra os emuladores
        run: |
          set -euo pipefail
          docker compose exec -T api pytest tests -v

      - name: Exibir diagnóstico em caso de falha
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose ps
          echo "=== docker compose logs ==="
          docker compose logs --no-color

      - name: Derrubar ambiente e limpar volumes
        if: always()
        run: docker compose down -v

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - segredos
      - higiene
      - api-qualidade
      - api-testes
      - web-qualidade
      - web-build
      - dockerfiles
      - compose-smoke
      - seed-qualidade
    steps:
      - name: Validar integridade e sucesso de todos os jobs anteriores
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          echo "Status consolidado de cada job de verificação:"
          python3 << 'EOF'
          import json, os, sys

          raw = os.environ.get("RESULTS", "{}")
          try:
              data = json.loads(raw)
          except Exception as err:
              print(f"ERRO: Falha ao decodificar JSON dos resultados: {err}")
              sys.exit(1)

          failed = []
          for job, info in data.items():
              result = info.get("result")
              print(f"  - {job}: {result}")
              # Decisão explícita sobre `skipped`:
              # Não utilizamos filtros de paths (`paths:`) nos checks obrigatórios.
              # Portanto, nenhum job deve ser "skipped". Se um job for pulado (por exemplo,
              # se um job dependente não executou porque a dependência falhou, ou por filtro
              # acidental), consideramos falha do check agregador.
              if result != "success":
                  failed.append((job, result))

          if failed:
              print("\nERRO: Os seguintes jobs NÃO foram concluídos com sucesso:")
              for job, res in failed:
                  print(f"  ❌ {job}: status \"{res}\" (esperado: \"success\")")
              sys.exit(1)

          print("\n✅ Todos os jobs anteriores foram concluídos com sucesso. ci-ok aprovado!")
          EOF
