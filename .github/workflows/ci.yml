# CI mínimo do Habilita (Prompt 1).
# Os nomes dos jobs (`segredos` e `higiene`) são usados como checks obrigatórios
# na proteção da `main`: NÃO renomeie sem atualizar a proteção no GitHub.
# O Prompt 3 acrescentará lint, tipagem e build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Menor permissão possível: o CI só precisa ler o código.
permissions:
  contents: read

# Cancela execuções antigas do mesmo PR quando chega um commit novo.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  # SHA-256 oficial de gitleaks_8.30.1_linux_x64.tar.gz (arquivo checksums.txt da release).
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  PRE_COMMIT_VERSION: 4.7.0

jobs:
  segredos:
    name: segredos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Gitleaks (binário oficial, versão e checksum fixos)
        run: |
          set -euo pipefail
          arquivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$arquivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${arquivo}"
          echo "${GITLEAKS_SHA256}  ${arquivo}" | sha256sum --check --strict
          tar -xzf "$arquivo" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Varrer todo o histórico do Git
        run: gitleaks git --config .gitleaks.toml --redact --verbose --no-banner .

  higiene:
    name: higiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar pre-commit
        run: python -m pip install "pre-commit==${PRE_COMMIT_VERSION}"

      - name: Rodar os hooks em todos os arquivos
        env:
          # O Gitleaks já roda no job `segredos`.
          SKIP: gitleaks
        run: pre-commit run --all-files --show-diff-on-failure
