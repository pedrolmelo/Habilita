# Dependabot: abre PRs automáticos para atualizar dependências (toda semana).
# Ecossistemas conferidos na documentação oficial do GitHub (supported ecosystems):
# github-actions, uv, npm, docker e docker-compose.
# Cada entrada aponta para uma pasta que TEM manifesto (senão o Dependabot dá erro).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # API Python gerenciada pelo uv (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-deps:
        patterns:
          - "*"

  # Seed Python gerenciado pelo uv (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /seed
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-deps:
        patterns:
          - "*"

  # Frontend (package.json + package-lock.json).
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-deps:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Imagens base dos Dockerfiles (tag + digest).
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /infra/emulators
      - /seed
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-images:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    ignore:
      # Python fica na 3.12: só aceita patches (3.12.x)
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Node fica no LTS ativo (24): só aceita minors e patches
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # docker-compose.yml da raiz.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-compose:
        patterns:
          - "*"
