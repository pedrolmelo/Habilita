# Configuração do Gitleaks (scanner de segredos).
# Usa todas as regras padrão do Gitleaks. Só acrescente uma allowlist se houver
# falso positivo REAL, restrita ao arquivo e à regra específica, com comentário do motivo.
title = "Habilita gitleaks config"

[extend]
useDefault = true

# Chaves JWT dummy/públicas do Supabase self-hosted (iss "supabase-demo").
# Utilizadas exclusivamente para desenvolvimento local do Supabase Storage.
# O commit 0a2bf12 adicionou estas chaves em .env.example na branch do PR #29.
[[rules]]
id = "jwt"
[rules.allowlist]
description = "Chaves JWT públicas/demo do Supabase self-hosted (iss supabase-demo, commit 0a2bf12)"
stopwords = [
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE",
