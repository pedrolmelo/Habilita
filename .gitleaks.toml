# Configuração do Gitleaks (scanner de segredos).
# Usa todas as regras padrão do Gitleaks. Só acrescente uma allowlist se houver
# falso positivo REAL, restrita ao arquivo e à regra específica, com comentário do motivo.
title = "Habilita gitleaks config"

[extend]
useDefault = true

# Chaves JWT dummy/públicas do Supabase utilizadas exclusivamente em ambiente local (.env.example e docker-compose.yml)
[allowlist]
description = "Tokens JWT de desenvolvimento local do Supabase Storage"
paths = [
  '''^\.env\.example$''',
  '''^docker-compose\.yml$''',
  '''^\.github/workflows/ci\.yml$''',
  '''^apps/api/src/habilita/config\.py$''',
  '''^seed/src/habilita_seed/config\.py$'''
]
